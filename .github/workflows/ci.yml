name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Vulnerability audit
        shell: bash
        run: bash .github/scripts/nuget-audit.sh

      - name: Build
        run: dotnet build Jmaka.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Jmaka.slnx -c Release --no-build --no-restore

      - name: Smoke
        shell: pwsh
        run: ./tests/smoke-api-version.ps1
